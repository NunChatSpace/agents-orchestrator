services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oagent
      POSTGRES_USER: oagent
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  registry:
    image: registry:2
    ports:
      - "5001:5000"
    volumes:
      - registrydata:/var/lib/registry

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://oagent:secret@postgres:5432/oagent?sslmode=disable
      SESSION_SECRET: changeme32byteslongsecretkey1234
      SEED_USERNAME: admin
      SEED_PASSWORD: changeme
      PORT: 8080
      LOG_LEVEL: info
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
      GIT_TOKEN: ${GIT_TOKEN:-}
      NGINX_PREVIEW_CONF: /app/infra/nginx/preview-upstreams.conf
      DOCKER_PREVIEW_NETWORK: bridge
      PREVIEW_BASE_DOMAIN: shiphide
      PREVIEW_TLD: preview
      HEALTH_CHECK_RETRIES: 20
      HEALTH_CHECK_INTERVAL_SECONDS: 3
    volumes:
      # Workspace root — each worker's subdir is mounted here.
      # migration 004 sets worker.workspace = /workspaces/<name>
      - ${WORKSPACES_PATH:-}:/workspaces
      # Share host SSH keys and git config so git clone works without re-setup on rebuild.
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
      # Share host codex auth so CLI agents inside the container use the same login session.
      - ~/.codex:/root/.codex
      # Synthetic worker builds run inside the backend container.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared generated nginx preview config for plan route updates.
      - ./infra/nginx/preview-upstreams.conf:/app/infra/nginx/preview-upstreams.conf
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    develop:
      watch:
        - action: rebuild
          path: ./backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/preview-upstreams.conf:/etc/nginx/conf.d/preview-upstreams.conf
    ports:
      - "5174:80"
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  registrydata:
